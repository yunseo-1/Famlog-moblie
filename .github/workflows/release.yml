name: Release (Play 내부 테스트)

# 서명한 AAB를 만들어 Play Console 내부 테스트 트랙에 올린다 (S22).
# 첫 AAB는 Play Console에서 직접 올려야 한다 (앱 생성·Play App Signing 등록). 그 뒤부터 이 워크플로를 쓴다.
#
# 필요한 저장소 설정
# - Secrets: FAMLOG_UPLOAD_KEYSTORE_BASE64, FAMLOG_UPLOAD_STORE_PASSWORD, FAMLOG_UPLOAD_KEY_ALIAS, FAMLOG_UPLOAD_KEY_PASSWORD,
#            FAMLOG_KAKAO_NATIVE_APP_KEY, FAMLOG_GOOGLE_WEB_CLIENT_ID, PLAY_SERVICE_ACCOUNT_JSON
# - Variables: FAMLOG_RELEASE_API_BASE_URL (https://api.famlog.kr/api/v1/), FAMLOG_RELEASE_WEB_BASE_URL (https://famlog.kr/)

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Play 출시 상태 (앱이 아직 초안 상태면 draft)'
        type: choice
        options: [completed, draft]
        default: completed
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 업로드 키·버전 코드 준비
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.FAMLOG_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # 첫 수동 업로드(versionCode 1)와 겹치지 않게 100을 더한다
          echo "FAMLOG_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: 단위 테스트·서명 AAB
        env:
          FAMLOG_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          FAMLOG_UPLOAD_STORE_PASSWORD: ${{ secrets.FAMLOG_UPLOAD_STORE_PASSWORD }}
          FAMLOG_UPLOAD_KEY_ALIAS: ${{ secrets.FAMLOG_UPLOAD_KEY_ALIAS }}
          FAMLOG_UPLOAD_KEY_PASSWORD: ${{ secrets.FAMLOG_UPLOAD_KEY_PASSWORD }}
          FAMLOG_KAKAO_NATIVE_APP_KEY: ${{ secrets.FAMLOG_KAKAO_NATIVE_APP_KEY }}
          FAMLOG_GOOGLE_WEB_CLIENT_ID: ${{ secrets.FAMLOG_GOOGLE_WEB_CLIENT_ID }}
          FAMLOG_RELEASE_API_BASE_URL: ${{ vars.FAMLOG_RELEASE_API_BASE_URL }}
          FAMLOG_RELEASE_WEB_BASE_URL: ${{ vars.FAMLOG_RELEASE_WEB_BASE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease

      - name: 업로드 키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: AAB·매핑 보관
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.FAMLOG_VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: 내부 테스트 트랙 업로드
        # r0adkll/upload-google-play v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.famlog
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: ${{ inputs.status || 'completed' }}
